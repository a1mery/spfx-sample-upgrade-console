# Prepares the Copilot coding agent's environment. Must be on the default branch,
# and the job must be named exactly `copilot-setup-steps`.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pre-install dependencies once the scaffold exists
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile yet"; fi
